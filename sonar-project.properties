# Public project identifiers; the analysis token stays in GitHub secrets.
sonar.projectKey=dkippes_TP-PDES
sonar.organization=dkippes
sonar.projectName=AterrizAR
sonar.sourceEncoding=UTF-8

# One Sonar project covers the three applications without coupling their builds.
sonar.sources=backend/src/main/kotlin,flying.service/src/main/kotlin,front/src
sonar.tests=backend/src/test/kotlin,flying.service/src/test/kotlin,front/tests
sonar.java.source=21
sonar.kotlin.source.version=2.3
sonar.java.binaries=backend/build/classes/kotlin/main,flying.service/build/classes/kotlin/main
sonar.java.test.binaries=backend/build/classes/kotlin/test,flying.service/build/classes/kotlin/test
sonar.java.libraries=backend/build/sonar/libraries/*.jar,flying.service/build/sonar/libraries/*.jar
sonar.java.test.libraries=backend/build/sonar/libraries/*.jar,flying.service/build/sonar/libraries/*.jar
sonar.junit.reportPaths=backend/build/test-results/test,flying.service/build/test-results/test
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml,flying.service/build/reports/jacoco/test/jacocoTestReport.xml

# Frontend remains statically analyzed, but coverage is required only for Kotlin services.
sonar.coverage.exclusions=front/src/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
