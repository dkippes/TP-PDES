name: aterrizar
services:
  postgres:
    image: postgres:16-alpine
    container_name: aterrizar-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aterrizar_db}
      POSTGRES_USER: ${POSTGRES_USER:-aterrizar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aterrizar123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aterrizar} -d ${POSTGRES_DB:-aterrizar_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aterrizar-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aterrizar_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${POSTGRES_USER:-aterrizar}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-aterrizar123}}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      FLYING_SERVICE_URL: ${FLYING_SERVICE_URL:-http://flying-service:8081}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "5005:5005"
    volumes:
      - ./backend:/app
      - gradle-cache-backend:/home/gradle/.gradle
      - /app/build
      - /app/.gradle
    depends_on:
      postgres:
        condition: service_healthy
      flying-service:
        condition: service_started
    networks:
      - app-network
  flying-service:
    build:
      context: ./flying.service
      dockerfile: Dockerfile
    container_name: aterrizar-flying
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "${FLYING_SERVICE_PORT:-8081}:8081"
      - "5006:5006"
    volumes:
      - ./flying.service:/app
      - gradle-cache-flying:/home/gradle/.gradle
      - /app/build
      - /app/.gradle
    networks:
      - app-network
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: aterrizar-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8080}
      VITE_FLYING_SERVICE_URL: http://localhost:${FLYING_SERVICE_PORT:-8081}
    ports:
      - "${FRONT_PORT:-5173}:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network
volumes:
  pgdata:
    name: aterrizar-pgdata
  gradle-cache-backend:
    name: aterrizar-gradle-backend
  gradle-cache-flying:
    name: aterrizar-gradle-flying
networks:
  app-network:
    name: aterrizar-network
    driver: bridge
