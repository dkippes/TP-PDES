# API pública de la aplicación: Deployment con probes, rolling update y
# autoscaling (HPA), más su Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: aterrizar
spec:
  # No se define `replicas`: la cantidad la maneja el HPA de más abajo. Arranca
  # en 1 porque los seeders de datos demo pueden chocar si dos copias arrancan
  # a la vez con la base vacía.
  # Actualiza sin corte aun con una sola réplica.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: aterrizar
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        # Sin flying-service el seeder de paquetes demo se saltea.
        - name: wait-flying-service
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://flying-service:8081/ping; do sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: backend
          image: aterrizar-backend:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Por defecto la JVM usa el 25% del límite de memoria como heap; con 768Mi queda corta.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/aterrizar_db
            - name: SPRING_DATASOURCE_USERNAME
              value: aterrizar
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aterrizar-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aterrizar-secrets
                  key: JWT_SECRET
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: aterrizar-config
                  key: SPRING_PROFILES_ACTIVE
            - name: CORS_ALLOWED_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: aterrizar-config
                  key: CORS_ALLOWED_ORIGIN
            - name: FLYING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: aterrizar-config
                  key: FLYING_SERVICE_URL
            - name: REFRESH_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: aterrizar-config
                  key: REFRESH_COOKIE_SECURE
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            # Margen para que una prueba de carga no dispare un reinicio.
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: aterrizar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 8080
      targetPort: 8080
---
# Escala el backend entre 1 y 3 réplicas según el uso de CPU (requiere metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: aterrizar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
