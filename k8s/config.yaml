# Configuración compartida (ConfigMap) y credenciales (Secret) del stack.
# Valores de desarrollo, los mismos defaults que los Compose; no usar fuera de
# un cluster local.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aterrizar-config
  labels:
    app.kubernetes.io/name: aterrizar-config
    app.kubernetes.io/part-of: aterrizar
data:
  SPRING_PROFILES_ACTIVE: dev
  CORS_ALLOWED_ORIGIN: http://localhost
  FLYING_SERVICE_URL: http://flying-service:8081
  REFRESH_COOKIE_SECURE: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: aterrizar-secrets
  labels:
    app.kubernetes.io/name: aterrizar-secrets
    app.kubernetes.io/part-of: aterrizar
type: Opaque
stringData:
  POSTGRES_PASSWORD: aterrizar123
  FLYING_POSTGRES_PASSWORD: flying123
  JWT_SECRET: dev-jwt-secret-min-32-chars-long-change-me-in-prod
