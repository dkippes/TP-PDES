apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - prometheus.yaml
  - loki.yaml
  - alloy.yaml
  - alloy-rbac.yaml
  - grafana.yaml
  - ../../observability
configMapGenerator:
  - name: prometheus-config
    namespace: aterrizar-observability
    files: [prometheus.yml]
  - name: alloy-config
    namespace: aterrizar-observability
    files: [alloy.alloy]
