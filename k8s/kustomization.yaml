# Punto de entrada: `kubectl apply -k k8s/` aplica AterrizAR y su observabilidad.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - flying-postgres.yaml
  - flying-service.yaml
  - backend.yaml
  - front.yaml
  - ingress.yaml
  - observability

# El Secret `aterrizar-secrets` se genera desde un archivo local que git ignora.
# Crealo copiando secrets.env.example antes de aplicar.
secretGenerator:
  - name: aterrizar-secrets
    namespace: aterrizar
    envs:
      - secrets.env
generatorOptions:
  disableNameSuffixHash: true
