spring.application.name=flying.service
server.port=8081
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://flying-postgres:5432/flying_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flying}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:flying123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Observability: Prometheus scrapes /actuator/prometheus; set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs (Loki)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
