spring.application.name=backend
server.port=8080
flying.service.url=${FLYING_SERVICE_URL:http://flying-service:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/aterrizar_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aterrizar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aterrizar123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.flyway.enabled=true
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.auth.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:604800000}
app.auth.refresh-cookie.name=${REFRESH_COOKIE_NAME:refresh_token}
app.auth.refresh-cookie.path=${REFRESH_COOKIE_PATH:/api/auth}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
