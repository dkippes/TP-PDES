name: CD

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Resolve release tag
    # Manual tag pushes, or a merged PR into main from a release/* branch.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            ref="$GITHUB_SHA"
          else
            version="${HEAD_REF#release/}"
            version="${version#v}"
            ref="$MERGE_SHA"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Branch '$HEAD_REF' must be named release/X.Y.Z to derive a version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Create tag on the merge commit
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.ref }}
        run: |
          # gh api prints the 404 JSON body to stdout, so test the exit status, not the output.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --silent 2>/dev/null; then
            echo "::error::Tag v${VERSION} already exists; bump the release branch version."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" -f sha="$SHA"

  publish:
    name: Publish ${{ matrix.service }} image
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: aterrizar-backend
          - service: flying-service
            context: ./flying.service
            image: aterrizar-flying-service
          - service: front
            context: ./front
            image: aterrizar-front
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.ref }}
          fetch-depth: 0

      - name: Verify tag belongs to main
        env:
          RELEASE_SHA: ${{ needs.tag.outputs.ref }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release v${{ needs.tag.outputs.version }} is not on main; releases must be tagged after merging into main."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.tag.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish-compose:
    name: Publish compose stack
    needs: [tag, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare compose file
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          mkdir -p dist
          sed -e "s|your-dockerhub-user|${DOCKERHUB_USERNAME}|" \
              -e "s|\${VERSION:-latest}|\${VERSION:-${version}}|" \
              docker-compose.release.yml > dist/docker-compose.yml
          docker compose version
          docker compose -f dist/docker-compose.yml config --quiet

      - name: Publish compose as OCI artifact
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          cd dist
          docker compose publish -y "${DOCKERHUB_USERNAME}/aterrizar-compose:${version}"
          docker compose publish -y "${DOCKERHUB_USERNAME}/aterrizar-compose:latest"
