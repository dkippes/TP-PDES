name: Flying Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "flying.service/**"
      - ".github/workflows/flying-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "flying.service/**"
      - ".github/workflows/flying-service-ci.yml"

concurrency:
  group: flying-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flying.service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build jar
        run: ./gradlew build -x test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flying-service-test-report
          path: flying.service/build/reports/tests/test

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./flying.service
          push: false
          tags: aterrizar-flying-service:ci
          cache-from: type=gha,scope=flying-service
          cache-to: type=gha,mode=max,scope=flying-service
